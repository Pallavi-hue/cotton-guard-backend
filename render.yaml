services:
  - type: web
    name: cotton-guard-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: REQUIRE_AUTH
        value: "true"
      - key: FIREBASE_PROJECT_ID
        value: cotton-guard
      - key: FLASK_DEBUG
        value: "false"
